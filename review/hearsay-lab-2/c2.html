<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hearsay — C2 · selections — Ian Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
/* C — the back room jukebox, strips only. No cabinet. A quote becomes a title, a source becomes an artist. */
main{display:grid;place-items:center;background:
  radial-gradient(45% 50% at 50% 30%, rgba(255,196,120,.13), transparent 70%),
  radial-gradient(30% 45% at 0% 60%, rgba(216,53,138,.05), transparent 70%)}
.rack{width:min(640px,100% - 32px);padding:clamp(24px,5vh,56px) 0 clamp(56px,9vh,96px)}
.rack h1{font:400 11px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--meta);text-align:center;margin:0 0 22px}
.strips{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.strip{appearance:none;width:100%;border:0;padding:0;background:none;cursor:pointer;text-align:left;color:inherit;font:inherit}
.card{display:grid;grid-template-columns:3.2em 1fr 3.2em;align-items:stretch;background:linear-gradient(180deg,#e9dcbb,#dccb9f);color:#1b1713;min-height:64px;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 -1px 0 rgba(0,0,0,.12) inset,0 6px 18px rgba(0,0,0,.55)}
.code{display:grid;place-items:center;font:600 13px/1 var(--caps);letter-spacing:.08em;color:#e9dcbb;background:#1b1713;position:relative}
.code::after{content:"";position:absolute;bottom:7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#3a332b;transition:background .15s,box-shadow .15s}
.mid{display:grid;align-content:center;justify-items:center;text-align:center;padding:9px 16px 10px;gap:4px;border-top:1px solid rgba(0,0,0,.08);border-bottom:1px solid rgba(0,0,0,.08)}
.title{font:600 clamp(15px,1.6vw,20px)/1.15 var(--caps);letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.by{font:400 10.5px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:#5c5346}
.strip[aria-pressed="true"] .code::after{background:var(--magenta);box-shadow:0 0 6px var(--magenta),0 0 14px var(--magenta-soft)}
.strip[aria-pressed="true"] .card{background:linear-gradient(180deg,#f3e7c8,#e4d3a8)}
.strip:hover .card{background:linear-gradient(180deg,#eee1c1,#dfcea3)}
.qual{display:inline-block;margin-top:5px;font:600 8.5px/1 var(--caps);letter-spacing:.3em;text-transform:uppercase;color:#7a6a58;border:1px solid rgba(60,48,36,.35);padding:3px 6px 2px;transform:rotate(-1.2deg)}
.status{margin:22px 0 0;text-align:center;font:400 11px/1.8 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--meta);min-height:1.8em}
.status b{font-weight:400;color:var(--cream-soft)}
@media (max-width:600px){
  .card{grid-template-columns:2.6em 1fr 2.6em;min-height:58px}
  .title{font-size:14px}
  .by{font-size:9.5px}
}
</style></head>
<body>
<a class="skip" href="#rack">Skip to selections</a>
<header class="bar top"><span><a class="hi" href="/">IAN LUNA</a> · CREATIVE DIRECTOR</span><span>INT. · DINER · BACK ROOM · NIGHT</span></header>
<main>
 <section class="rack" id="rack" tabindex="-1" aria-labelledby="h">
  <h1 id="h">Hearsay · selections</h1>
  <ul class="strips">
   <li><button class="strip" type="button" aria-pressed="false" data-code="A1" data-by="Ex girlfriend"><span class="card"><span class="code">A1</span><span class="mid"><span class="title">Five stars.</span><span class="by">Ex girlfriend</span></span><span class="code">A1</span></span></button></li>
   <li><button class="strip" type="button" aria-pressed="false" data-code="A2" data-by="Neighbor"><span class="card"><span class="code">A2</span><span class="mid"><span class="title">He's never caused any problems in the building.</span><span class="by">Neighbor</span></span><span class="code">A2</span></span></button></li>
   <li><button class="strip" type="button" aria-pressed="false" data-code="A3" data-by="Sweets"><span class="card"><span class="code">A3</span><span class="mid"><span class="title">That boy good.</span><span class="by">Sweets</span></span><span class="code">A3</span></span></button></li>
   <li><button class="strip" type="button" aria-pressed="false" data-code="A4" data-by="Gore Vidal"><span class="card"><span class="code">A4</span><span class="mid"><span class="title">A creative genius second to none.</span><span class="by">Gore Vidal</span><span class="qual">Allegedly</span></span><span class="code">A4</span></span></button></li>
   <li><button class="strip" type="button" aria-pressed="false" data-code="A5" data-by="My mother"><span class="card"><span class="code">A5</span><span class="mid"><span class="title">The sweetest boy you'll ever meet.</span><span class="by">My mother</span></span><span class="code">A5</span></span></button></li>
  </ul>
  <p class="status" id="status" aria-live="polite"></p>
 </section>
</main>
<footer class="bar bottom"><nav aria-label="Primary" class="rail"><a href="/">Home</a><a href="/work/">Work</a><a href="/work/more/">More work</a><a href="/about/">About</a><a href="/hearsay/" aria-current="page">Hearsay</a></nav><span>Five selections · sound off</span></footer>
<div class="study-note">Hearsay lab 2 · C2</div>
<script>
(function(){
  var strips=[].slice.call(document.querySelectorAll('.strip')), st=document.getElementById('status');
  strips.forEach(function(b){ b.addEventListener('click',function(){
    strips.forEach(function(o){o.setAttribute('aria-pressed','false')});
    b.setAttribute('aria-pressed','true');
    st.innerHTML='Selected · <b>'+b.dataset.code+' · '+b.dataset.by.toUpperCase()+'</b> · sound off';
  });});
})();
</script>
</body></html>
