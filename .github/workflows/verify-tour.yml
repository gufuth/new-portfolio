name: Verify Last Stop tour

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-tour:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse shared runtime
        run: node --check tour-runtime.js
      - name: Audit tour wiring
        run: node scripts/verify-tour-runtime.mjs
      # This workflow intentionally excludes HEARSAY until Ian merges the current apparition build.
