name: Build Work visual lock plates

on:
  push:
    branches:
      - work/cinematic-case-master-scooba-20260908
    paths:
      - 'scripts/build-work-visual-lock-20260909.py'
      - '.github/workflows/build-work-visual-lock.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cinematic-case-master-scooba-20260908
          fetch-depth: 0
      - name: Install imaging dependencies
        run: python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Build versioned Work plates
        run: python scripts/build-work-visual-lock-20260909.py
      - name: Preserve visual evidence
        shell: bash
        run: |
          mkdir -p /tmp/work-lock
          cp assets/work-panorama-physical-v2.webp /tmp/work-lock/
          cp assets/more-work-panorama-five-v1.webp /tmp/work-lock/
      - uses: actions/upload-artifact@v4
        with:
          name: work-visual-lock-plates
          path: /tmp/work-lock
          retention-days: 14
      - name: Commit generated plates to corrective branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work-panorama-physical-v2.webp assets/more-work-panorama-five-v1.webp
          if git diff --cached --quiet; then
            echo 'No generated plate changes.'
            exit 0
          fi
          git commit -m 'Build locked Work 1 and five-board More Work plates'
          git push origin HEAD:work/cinematic-case-master-scooba-20260908
