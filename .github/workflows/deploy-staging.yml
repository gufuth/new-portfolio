name: Deploy Netlify staging

on:
  push:
    branches: [main, integration]
    paths:
      - 'index.html'
      - 'work.html'
      - 'more-work.html'
      - 'about.html'
      - 'hearsay.html'
      - '404.html'
      - '*.css'
      - '*.js'
      - 'cases/**'
      - 'review/**'
      - 'assets/**'
      - '_redirects'
      - '_headers'
      - '.github/workflows/deploy-staging.yml'

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: a01e14a9-cc73-4b33-a657-6bc4671a59a3
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check Netlify credential
        id: credential
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::NETLIFY_AUTH_TOKEN is not configured. Staging deploy skipped; build work continues normally.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble deploy directory
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/last-stop-deploy
          rsync -a ./ /tmp/last-stop-deploy/ \
            --exclude '.git/' --exclude '.github/' --exclude 'docs/' --exclude 'scripts/' \
            --exclude 'artifacts/' --exclude 'node_modules/' --exclude 'AGENTS.md' \
            --exclude 'CLAUDE.md' --exclude 'README.md' --exclude 'CURRENT_STATE.md' --exclude 'reports/' --exclude 'assets/plate-payload/' \
            --exclude 'assets/*.b64' --exclude '.DS_Store'
          # the mock site must never be indexed (it can carry placeholder proof)
          { echo; echo '/*'; echo '  X-Robots-Tag: noindex, nofollow'; } >> /tmp/last-stop-deploy/_headers
          { echo 'User-agent: *'; echo 'Disallow: /'; } > /tmp/last-stop-deploy/robots.txt
      - name: Deploy to staging
        if: steps.credential.outputs.ready == 'true'
        shell: bash
        run: |
          # integration -> free alias (preview) deploy: 0 Netlify credits. main -> production deploy (15 credits).
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            npx --yes netlify-cli@latest deploy --prod --dir=/tmp/last-stop-deploy --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Last Stop main ${GITHUB_SHA}"
          else
            npx --yes netlify-cli@latest deploy --alias="${GITHUB_REF_NAME//\//-}" --dir=/tmp/last-stop-deploy --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="Last Stop ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          fi
