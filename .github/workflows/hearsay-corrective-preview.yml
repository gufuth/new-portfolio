name: Hearsay corrective preview and QA

on:
  push:
    branches: [hearsay-elite-corrective]
  workflow_dispatch:

concurrency:
  group: hearsay-corrective-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: a01e14a9-cc73-4b33-a657-6bc4671a59a3
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  PW_TEST_SCREENSHOT_NO_FONTS_READY: '1'

jobs:
  draft-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4

      - name: Enforce corrective branch boundary
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "hearsay-elite-corrective"
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN is unavailable. The target-site draft step will be skipped and an isolated anonymous Netlify draft will be used for real deployed-pixel QA instead."
            echo "### Netlify credential boundary" >> "$GITHUB_STEP_SUMMARY"
            echo "- NETLIFY_AUTH_TOKEN is unavailable to this workflow." >> "$GITHUB_STEP_SUMMARY"
            echo "- The staging alias will not be touched." >> "$GITHUB_STEP_SUMMARY"
            echo "- A temporary anonymous Netlify draft will be used only as a real-network QA target." >> "$GITHUB_STEP_SUMMARY"
            echo "- The workflow will prefer a draft on site $NETLIFY_SITE_ID automatically whenever the token becomes available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify corrective source
        run: |
          node --check hearsay-system.js
          node --check hearsay-data.js
          node scripts/verify-hearsay-corrective.mjs
          node scripts/verify-tour-runtime.mjs

      - name: Assemble isolated deploy directory
        shell: bash
        run: |
          rm -rf /tmp/last-stop-hearsay-preview
          mkdir -p /tmp/last-stop-hearsay-preview
          rsync -a ./ /tmp/last-stop-hearsay-preview/ \
            --exclude '.git/' --exclude '.github/' --exclude 'docs/' --exclude 'scripts/' \
            --exclude 'artifacts/' --exclude 'node_modules/' --exclude 'AGENTS.md' \
            --exclude 'CLAUDE.md' --exclude 'README.md' --exclude 'assets/plate-payload/' \
            --exclude 'assets/*.b64' --exclude '.DS_Store' --exclude '.netlify/'
          mkdir -p /tmp/last-stop-hearsay-preview/hearsay
          cp /tmp/last-stop-hearsay-preview/hearsay.html /tmp/last-stop-hearsay-preview/hearsay/index.html

      - name: Start isolated local corrective server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/last-stop-hearsay-preview > /tmp/hearsay-local-server.log 2>&1 &
          echo $! > /tmp/hearsay-local-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/review/ >/dev/null && curl --fail --silent http://127.0.0.1:4173/hearsay/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hearsay-local-server.log
          exit 1

      - name: Create target-site Netlify draft deploy
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        id: deploy
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=/tmp/last-stop-hearsay-preview \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Hearsay corrective ${GITHUB_SHA}" \
            --json > /tmp/hearsay-deploy.json
          DEPLOY_URL=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/hearsay-deploy.json','utf8'));process.stdout.write(j.deploy_url||j.deployUrl||j.url||'')")
          test -n "$DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### Hearsay corrective target-site draft" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unique preview: $DEPLOY_URL/review/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integrated recommendation: $DEPLOY_URL/hearsay/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Draft deploy only; the staging alias was not changed." >> "$GITHUB_STEP_SUMMARY"

      - name: Create temporary anonymous Netlify draft fallback
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        id: anonymous-deploy
        continue-on-error: true
        shell: bash
        run: |
          cd /tmp/last-stop-hearsay-preview
          env -u NETLIFY_SITE_ID -u NETLIFY_AUTH_TOKEN npx --yes netlify-cli@latest deploy \
            --allow-anonymous \
            --dir=. \
            --json > /tmp/hearsay-anonymous-deploy.json 2> /tmp/hearsay-anonymous-deploy.err
          DEPLOY_URL=$(node -e "const fs=require('fs');const p='/tmp/hearsay-anonymous-deploy.json';if(!fs.existsSync(p))process.exit(0);const raw=fs.readFileSync(p,'utf8').trim();if(!raw)process.exit(0);const j=JSON.parse(raw);process.stdout.write(j.deploy_url||j.deployUrl||j.url||'')")
          test -n "$DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### Hearsay corrective anonymous draft fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Temporary preview: $DEPLOY_URL/review/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integrated recommendation: $DEPLOY_URL/hearsay/" >> "$GITHUB_STEP_SUMMARY"
          echo "- This is a temporary anonymous Netlify project used only for deployed-pixel QA." >> "$GITHUB_STEP_SUMMARY"
          echo "- It does not modify site a01e14a9-cc73-4b33-a657-6bc4671a59a3 or the staging alias." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve pixel-QA target
        id: qa-target
        shell: bash
        env:
          NETLIFY_DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ANONYMOUS_DEPLOY_URL: ${{ steps.anonymous-deploy.outputs.url }}
        run: |
          if [ -n "$NETLIFY_DEPLOY_URL" ]; then
            QA_URL="$NETLIFY_DEPLOY_URL"
            QA_KIND="netlify-target-site-draft"
          elif [ -n "$ANONYMOUS_DEPLOY_URL" ]; then
            QA_URL="$ANONYMOUS_DEPLOY_URL"
            QA_KIND="netlify-anonymous-draft"
          else
            QA_URL="http://127.0.0.1:4173"
            QA_KIND="isolated-local"
          fi
          echo "url=$QA_URL" >> "$GITHUB_OUTPUT"
          echo "kind=$QA_KIND" >> "$GITHUB_OUTPUT"
          echo "### Pixel-QA target" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: $QA_KIND" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $QA_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render real pixels and run interaction checks
        env:
          BASE_URL: ${{ steps.qa-target.outputs.url }}
        run: node scripts/render-hearsay-corrective.mjs

      - name: Record deployment boundary
        if: always()
        shell: bash
        env:
          TARGET_URL: ${{ steps.deploy.outputs.url }}
          ANONYMOUS_URL: ${{ steps.anonymous-deploy.outputs.url }}
          QA_KIND: ${{ steps.qa-target.outputs.kind }}
          QA_URL: ${{ steps.qa-target.outputs.url }}
        run: |
          mkdir -p artifacts/hearsay-corrective
          {
            echo "target_site_id=$NETLIFY_SITE_ID"
            echo "target_site_draft_url=$TARGET_URL"
            echo "anonymous_draft_url=$ANONYMOUS_URL"
            echo "qa_kind=$QA_KIND"
            echo "qa_url=$QA_URL"
            echo "staging_alias_changed=false"
            echo "production_deploy_used=false"
          } > artifacts/hearsay-corrective/deployment-boundary.txt
          if [ -z "$TARGET_URL" ]; then
            printf '%s\n' 'Target-site draft not created because NETLIFY_AUTH_TOKEN is unavailable to GitHub Actions. A temporary anonymous Netlify draft was attempted for deployed-pixel QA; the staging alias remained untouched.' > artifacts/hearsay-corrective/target-site-draft-blocker.txt
          fi
          if [ -f /tmp/hearsay-anonymous-deploy.err ]; then
            cp /tmp/hearsay-anonymous-deploy.err artifacts/hearsay-corrective/anonymous-deploy-stderr.txt
          fi

      - name: Upload complete Hearsay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearsay-corrective-${{ github.sha }}
          path: artifacts/hearsay-corrective
          if-no-files-found: warn
          retention-days: 90
