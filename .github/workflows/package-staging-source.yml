name: Package staging source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-staging-source.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy-only source archive
        run: |
          zip -qr /tmp/last-stop-staging-source.zip . \
            -x '.git/*' '.github/*' 'docs/*' 'scripts/*' 'artifacts/*' 'node_modules/*' \
               'AGENTS.md' 'CLAUDE.md' 'README.md' 'assets/plate-payload/*' 'assets/*.b64' '.DS_Store'
          unzip -l /tmp/last-stop-staging-source.zip | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: last-stop-staging-source
          path: /tmp/last-stop-staging-source.zip
          retention-days: 2
          if-no-files-found: error
