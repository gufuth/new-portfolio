name: Materialize current WORK plates

on:
  push:
    branches: [main]
    paths:
      - 'assets/work-panorama-current.b64'
      - 'assets/more-work-panorama-current.b64'
      - '.github/workflows/materialize-current-plates.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode approved working plates
        run: |
          base64 --decode assets/work-panorama-current.b64 > assets/work-panorama-current.webp
          base64 --decode assets/more-work-panorama-current.b64 > assets/more-work-panorama-current.webp
          file assets/work-panorama-current.webp
          file assets/more-work-panorama-current.webp
      - name: Commit binary plates if changed
        run: |
          if git diff --quiet -- assets/work-panorama-current.webp assets/more-work-panorama-current.webp && git ls-files --error-unmatch assets/work-panorama-current.webp assets/more-work-panorama-current.webp >/dev/null 2>&1; then
            echo 'Current plates already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work-panorama-current.webp assets/more-work-panorama-current.webp
          git commit -m 'Materialize approved current WORK plates'
          git push origin HEAD:main
