name: Last Stop static quality

on:
  push:
    branches: [ main, "quality/**" ]
  pull_request:
    branches: [ main ]

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit routes, semantics, case counts and project laws
        run: python scripts/qa_static.py
