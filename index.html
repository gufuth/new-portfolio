<style>
  :root{ --bar:#080706; --meta:#968c7a; --meta-hi:#e8dcc4; --bar-h:34px; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;height:100%;overflow:hidden}
  body{display:flex; flex-direction:column}

  /* FilmFrame bars: viewport-fixed. Never animate, never scale. */
  .bar{flex:0 0 var(--bar-h); background:var(--bar); z-index:20;
    display:flex; align-items:center; justify-content:space-between; padding:0 28px;
    font-family:Consolas,"Courier New",monospace; font-size:11px; letter-spacing:.30em;
    text-transform:uppercase; color:var(--meta)}
  .bar .hi{color:var(--meta-hi)}
  .bar span{white-space:nowrap}

  .scenewrap{flex:1 1 auto; position:relative; overflow:hidden; background:#000}
  .stage{
    position:absolute; left:50%; top:0; width:1536px; height:1024px;
    transform:translate(-50%,var(--shift,0px)) scale(var(--fit,1)); transform-origin:top center;
    overflow:hidden;
    background:#000;
    user-select:none;
  }

  /* sign hotspots: the signs ARE the nav */
  .hot{position:absolute; cursor:pointer; border-radius:6px;}
  .hot .lift{position:absolute; inset:-12%; opacity:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,236,180,.14) 0%, rgba(255,236,180,0) 70%);
    mix-blend-mode:screen; transition:opacity .25s ease}
  .hot:hover .lift, .hot:focus-visible .lift{opacity:1}
  .hot:focus-visible{outline:2px solid rgba(236,226,198,.85); outline-offset:4px}

  #hotWork  {left:22.5%; top:39.5%; width:44.5%; height:31.5%}
  #hotAbout {left:1.5%;  top:23.5%; width:15.5%; height:9.5%}
  #hotHearsay{left:83.5%; top:38.5%; width:12.5%; height:44.0%}

  /* --- threshold: voltage flicker on the WORK window, then exposure cut.
         Bars stay static; only their text goes silent. --- */
  #voltage{position:absolute; left:22.5%; top:39.5%; width:44.5%; height:31.5%;
    background:#000; opacity:0; pointer-events:none; z-index:6}
  body.cutting #voltage{animation:voltage .42s steps(1,end) forwards}
  @keyframes voltage{
    0%{opacity:0} 18%{opacity:.55} 30%{opacity:.08} 46%{opacity:.7}
    62%{opacity:.15} 78%{opacity:.5} 100%{opacity:.85}}
  #blackout{position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    z-index:15; transition:opacity .26s ease .42s}
  body.cutting #blackout{opacity:1}
  body.fading #blackout{opacity:1; transition-delay:0s}
  .bar span{transition:opacity .2s ease}
  body.cutting .bar span, body.fading .bar span{opacity:0}

  @media (prefers-reduced-motion: reduce){
    .hot .lift{transition:none}
    body.cutting #voltage{animation:none}
    #blackout{transition:none}
  }

  /* the plate arrives dark and resolves — boot behavior, one beat per load */
  #plate{position:absolute; inset:0; z-index:0; background:#000 center/cover no-repeat url('data:image/webp;base64,UklGRoIAAABXRUJQVlA4IHYAAAAQBACdASoYABAAPulgqE2pJaOiMAgBIB0JZAC7ACFrtTlHLrCxiPiLoAD+8quGESIrULtbRFie11GKKISOPc4uGZuav1xlLQ4MJWqa4BG37gbvdlL5MyNmp6nMmw/lVxe32GFOs2l8N7KkS7tRHw3Ao+j9s9gA');
    filter:blur(12px) brightness(.6); transform:scale(1.04);
    transition:filter .45s ease, transform .45s ease}
  #plate.resolved{filter:none; transform:none}
  @media (prefers-reduced-motion: reduce){ #plate{transition:none} }

  /* sound switch: gold register, remembered across the site */
  .snd{position:absolute; right:34px; bottom:30px; z-index:11; cursor:pointer; background:none; border:0;
    font-family:Georgia,serif; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:#a8946a; text-shadow:0 1px 1px rgba(0,0,0,.8); transition:color .18s ease}
  .snd:hover,.snd:focus-visible{color:#f4e3af}
  .snd:focus-visible{outline:2px solid rgba(236,226,198,.85); outline-offset:2px}
  .hot:active .lift{opacity:.75}
  body.pinkfade #blackout{opacity:1; background:#150409; transition:opacity .42s ease}
</style>

<div class="bar top"><span><span class="hi">Ian Luna</span>&nbsp;&nbsp;·&nbsp;&nbsp;Creative Director</span><span>MMX — MMXXVI&nbsp;&nbsp;·&nbsp;&nbsp;Frame 001</span></div>
<div class="scenewrap" id="wrap">
  <div class="stage" id="stage" role="group" aria-label="The Last Stop Diner at night. The signs are the navigation.">
    <div id="plate"></div>
    <a class="hot" id="hotWork" href="work.html" aria-label="Work — selected projects. The green sign in the front window.">
      <span class="lift"></span></a>
    <a class="hot" id="hotAbout" href="about.html" aria-label="About — who Ian Luna is. The neon sign on the left."
      ><span class="lift"></span></a>
    <a class="hot" id="hotHearsay" href="hearsay.html" aria-label="Hearsay — what people say about working with Ian. The pink door on the right."
      ><span class="lift"></span></a>
    <div id="voltage"></div>
  </div>
  <div id="blackout"></div>
  <button class="snd" id="snd" aria-pressed="true">Sound · On</button>
</div>
<div class="bar bottom"><span>EXT. The Last Stop Diner — Night</span><span id="clock">T 00:00 UTC</span></div>

<script>
  function fit(){
    const w = document.getElementById('wrap');
    const s = Math.max(w.clientWidth / 1536, w.clientHeight / 1024);
    const st = document.getElementById('stage');
    st.style.setProperty('--fit', s);
    // vertical overflow: take up to 40% from the sky, capped so the IAN LUNA
    // lightbox always survives (70 plate px of safe sky above it); the rest
    // comes off the street. Keeps the concrete at most window shapes.
    const overflow = Math.max(0, 1024 * s - w.clientHeight);
    const topCrop = Math.min(overflow * 0.4, 70 * s);
    st.style.setProperty('--shift', (-topCrop) + 'px');
  }
  window.addEventListener('resize', fit); fit();

  // worn brass shop-door bell — v2, replacing the May sine pair (too clean,
  // read as a notification ding). Noise strike + inharmonic brass partials +
  // the double hit a real door gives a bell. Tunables: BASE, partial ratios, decays.
  function chime(){
    if(localStorage.getItem('lsd_sound')==='off') return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ctx.currentTime;
      const master = ctx.createGain(); master.gain.value = .55;
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 3400;
      master.connect(lp); lp.connect(ctx.destination);
      const BASE = 840;
      // partial: [ratio, level, decay seconds] — inharmonic, worn, dark
      const PARTIALS = [[1,.11,.75],[1.83,.08,.55],[2.76,.05,.40],[4.07,.028,.28],[5.43,.014,.20]];
      function strike(t, vel){
        // the knock: a short band-passed noise burst
        const nb = ctx.createBuffer(1, ctx.sampleRate*.05, ctx.sampleRate);
        const nd = nb.getChannelData(0);
        for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1) * (1 - i/nd.length);
        const n = ctx.createBufferSource(); n.buffer = nb;
        const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2300; bp.Q.value=2.5;
        const ng = ctx.createGain(); ng.gain.value = .10*vel;
        n.connect(bp); bp.connect(ng); ng.connect(master);
        n.start(t);
        // the ring: detuned inharmonic partials, slight downward drift
        PARTIALS.forEach(([r, lvl, dec])=>{
          const o = ctx.createOscillator(); o.type='sine';
          const cents = (Math.random()*12 - 6);
          const f = BASE * r * Math.pow(2, cents/1200);
          o.frequency.setValueAtTime(f, t);
          o.frequency.linearRampToValueAtTime(f * .997, t + dec);
          const g = ctx.createGain(); g.gain.value = 0;
          o.connect(g); g.connect(master);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(lvl*vel, t + .006);
          g.gain.exponentialRampToValueAtTime(.0001, t + dec);
          o.start(t); o.stop(t + dec + .05);
        });
      }
      strike(t0, 1.0);        // door hits the bell
      strike(t0 + .09, .45);  // bell swings back and clips it again, softer
    }catch(e){}
  }

  // threshold: click WORK → bell + sign voltage dies + cut to black + inside. ~1.1s.
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('hotWork').addEventListener('click', e=>{
    e.preventDefault();
    sessionStorage.setItem('lsd_from','landing');
    chime();
    if(reduced){ location.href = 'work.html'; return; }
    document.body.classList.add('cutting');
    setTimeout(()=>{ location.href = 'work.html#threshold'; }, 740);
  });

  // ABOUT: no bell (the bell belongs to the diner door; the motel is a walk
  // across the lot). Quiet fade to black, then the room. Its own threshold
  // gets designed in Phase E proper.
  document.getElementById('hotAbout').addEventListener('click', e=>{
    e.preventDefault();
    sessionStorage.setItem('lsd_from','landing');
    if(reduced){ location.href = 'about.html'; return; }
    document.body.classList.add('fading');
    setTimeout(()=>{ location.href = 'about.html'; }, 340);
  });

  function clock(){
    const n = new Date();
    document.getElementById('clock').textContent =
      `T ${String(n.getUTCHours()).padStart(2,'0')}:${String(n.getUTCMinutes()).padStart(2,'0')} UTC`;
  }
  clock(); setInterval(clock, 60000);

  // sound switch (site-wide preference)
  const sndEl = document.getElementById('snd');
  function sndLabel(){ const on = localStorage.getItem('lsd_sound')!=='off';
    sndEl.textContent = 'Sound · ' + (on ? 'On' : 'Off');
    sndEl.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  sndEl.addEventListener('click', ()=>{
    localStorage.setItem('lsd_sound', localStorage.getItem('lsd_sound')==='off' ? 'on' : 'off');
    sndLabel(); });
  sndLabel();

  // stepping back outside: exposure settles — only when you came from inside
  (function(){
    const FROM = sessionStorage.getItem('lsd_from');
    if(FROM){ sessionStorage.removeItem('lsd_from'); }
    if(FROM && FROM !== 'landing' && !reduced){
      window._settled = true;
      const st = document.getElementById('stage');
      st.style.filter = 'brightness(.25)';
      setTimeout(()=>{ st.style.transition = 'filter .55s ease'; st.style.filter = 'brightness(1)'; }, 60);
      setTimeout(()=>{ st.style.transition = ''; st.style.filter = ''; }, 950);
    }
  })();

  // full plate resolves over the LQIP; instant when an arrival settle owns the beat
  (function(){ const p=document.getElementById('plate'); const im=new Image();
    im.onload=()=>{ if(window._settled) p.style.transition='none';
      p.style.backgroundImage="url('landing.webp')";
      const go=()=>p.classList.add('resolved');
      requestAnimationFrame(()=>requestAnimationFrame(go));
      setTimeout(go, 450); };  // hidden-tab fallback: the world resolves anyway
    im.src='landing.webp'; })();


  // the pink door: silent threshold (the bell belongs to the front door)
  document.getElementById('hotHearsay').addEventListener('click', e=>{
    e.preventDefault();
    sessionStorage.setItem('lsd_from','landing');
    if(reduced){ location.href = 'hearsay.html'; return; }
    document.body.classList.add('pinkfade');
    setTimeout(()=>{ location.href = 'hearsay.html'; }, 430);
  });

  // the slate follows the visitor out of the room
  const HOME_TITLE = document.title;
  document.addEventListener('visibilitychange', ()=>{
    document.title = document.hidden ? '( the diner is still open )' : HOME_TITLE;
  });
</script>


<script>
/* keyboard-drill-down injected – do not remove this comment */
(function() {
  const containers = document.querySelectorAll(
    '#blocked-list, #ledger-list, #rig-list, [data-screen="blocked"] .list, [data-screen="ledger"] .list, [data-screen="rig"] .list'
  );
  containers.forEach(function(container) {
    if (container.dataset.kbdDrilldown) return;
    container.dataset.kbdDrilldown = 'true';
    container.setAttribute('tabindex', '0');
    container.addEventListener('keydown', function(e) {
      const items = container.querySelectorAll('.list-item');
      if (!items.length) return;
      let idx = parseInt(container.getAttribute('data-selected-index') || '0', 10);
      if (isNaN(idx)) idx = 0;

      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault();
        idx = Math.min(idx + 1, items.length - 1);
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault();
        idx = Math.max(idx - 1, 0);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const item = items[idx];
        if (item) {
          const btn = item.querySelector('.expand-btn, [data-action="expand"]');
          if (btn) btn.click();
        }
        return;
      } else if (e.key === 'Escape') {
        e.preventDefault();
        const item = items[idx];
        if (item) {
          const btn = item.querySelector('.collapse-btn, [data-action="collapse"]');
          if (btn) btn.click();
          item.classList.remove('expanded');
        }
        return;
      } else {
        return;
      }

      container.setAttribute('data-selected-index', idx);
      items.forEach(function(item, i) {
        item.classList.toggle('selected', i === idx);
      });
      items[idx].focus();
    });
  });
})();
</script>
