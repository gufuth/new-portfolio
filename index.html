<style>
  :root{--bar:#080706;--meta:#968c7a;--meta-hi:#e8dcc4;--bar-h:34px}
  *{margin:0;padding:0;box-sizing:border-box}html,body{background:#000;height:100%;overflow:hidden}body{display:flex;flex-direction:column}
  .bar{flex:0 0 var(--bar-h);background:var(--bar);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-family:Consolas,"Courier New",monospace;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--meta)}.bar .hi{color:var(--meta-hi)}.bar span{white-space:nowrap}
  .scenewrap{flex:1 1 auto;position:relative;overflow:hidden;background:#000}.stage{position:absolute;left:50%;top:0;width:1536px;height:1024px;transform:translate(-50%,var(--shift,0px)) scale(var(--fit,1));transform-origin:top center;overflow:hidden;background:#000;user-select:none}
  #plate{position:absolute;inset:0;z-index:0;background:#000 center/cover no-repeat url('data:image/webp;base64,UklGRoIAAABXRUJQVlA4IHYAAAAQBACdASoYABAAPulgqE2pJaOiMAgBIB0JZAC7ACFrtTlHLrCxiPiLoAD+8quGESIrULtbRFie11GKKISOPc4uGZuav1xlLQ4MJWqa4BG37gbvdlL5MyNmp6nMmw/lVxe32GFOs2l8N7KkS7tRHw3Ao+j9s9gA');filter:blur(12px) brightness(.6);transform:scale(1.04);transition:filter .45s ease,transform .45s ease}#plate.resolved{filter:none;transform:none}
  .hot{position:absolute;cursor:pointer;border-radius:6px}.hot .lift{position:absolute;inset:-12%;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(255,236,180,.14) 0%,rgba(255,236,180,0) 70%);mix-blend-mode:screen;transition:opacity .25s ease}.hot:hover .lift,.hot:focus-visible .lift{opacity:1}.hot:focus-visible{outline:2px solid rgba(236,226,198,.9);outline-offset:4px}
  #hotWork{left:22.5%;top:39.5%;width:44.5%;height:31.5%}#hotAbout{left:1.5%;top:23.5%;width:15.5%;height:9.5%}#hotHearsay{left:83.5%;top:38.5%;width:12.5%;height:44%}
  #voltage{position:absolute;left:22.5%;top:39.5%;width:44.5%;height:31.5%;background:#000;opacity:0;pointer-events:none;z-index:6}body.cutting #voltage{animation:voltage .42s steps(1,end) forwards}@keyframes voltage{0%{opacity:0}18%{opacity:.55}30%{opacity:.08}46%{opacity:.7}62%{opacity:.15}78%{opacity:.5}100%{opacity:.85}}
  #blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity .26s ease .42s}body.cutting #blackout{opacity:1}body.fading #blackout{opacity:1;transition-delay:0s}body.pinkfade #blackout{opacity:1;background:#150409;transition:opacity .42s ease}.bar span{transition:opacity .2s ease}body.cutting .bar span,body.fading .bar span,body.pinkfade .bar span{opacity:0}
  .snd{position:absolute;right:34px;bottom:30px;z-index:11;min-height:44px;cursor:pointer;background:none;border:0;font-family:Consolas,"Courier New",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#a8946a;text-shadow:0 1px 1px rgba(0,0,0,.8);padding:0 2px}.snd:hover,.snd:focus-visible{color:#f4e3af}.snd:focus-visible{outline:2px solid rgba(236,226,198,.9);outline-offset:3px}.hot:active .lift{opacity:.75}
  @media(max-width:719px){.bar{padding:0 14px;font-size:9px;letter-spacing:.16em}.bar.top span:last-child,.bar.bottom span:last-child{display:none}.snd{right:14px;bottom:14px}}
  @media(prefers-reduced-motion:reduce){#plate,.hot .lift,#blackout,.bar span{transition:none}body.cutting #voltage{animation:none}}

<body>
<div class="bar top"><span><span class="hi">Ian Luna</span>&nbsp;&nbsp;·&nbsp;&nbsp;Creative Director</span><span>EXTERIOR · THE LAST STOP DINER · NIGHT</span></div>
<div class="scenewrap" id="wrap">
  <div class="stage" id="stage" role="group" aria-label="The Last Stop Diner at night. The signs are the navigation."><div id="plate" aria-hidden="true"></div><a class="hot" id="hotWork" href="/work/" aria-label="Work — selected projects. The green sign in the front window."><span class="lift"></span></a><a class="hot" id="hotAbout" href="/about/" aria-label="About Ian Luna. The sign on the left."><span class="lift"></span></a><a class="hot" id="hotHearsay" href="/hearsay/" aria-label="Hearsay — what people say about working with Ian. The door on the right."><span class="lift"></span></a><div id="voltage"></div></div>
  <div id="blackout"></div><button class="snd" id="snd" aria-pressed="false">Sound · Off</button>
</div>
<div class="bar bottom"><span>EXT. The Last Stop Diner — Night</span><span>FRAME 001</span></div>
<script>
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit(){const w=document.getElementById('wrap');const s=Math.max(w.clientWidth/1536,w.clientHeight/1024);const st=document.getElementById('stage');st.style.setProperty('--fit',s);const overflow=Math.max(0,1024*s-w.clientHeight);const topCrop=Math.min(overflow*.4,70*s);st.style.setProperty('--shift',(-topCrop)+'px')}addEventListener('resize',fit);fit();
  function soundOn(){return localStorage.getItem('lsd_sound')==='on'}
  function chime(){if(!soundOn())return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const t0=ctx.currentTime;const master=ctx.createGain();master.gain.value=.55;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3400;master.connect(lp);lp.connect(ctx.destination);const BASE=840,PARTIALS=[[1,.11,.75],[1.83,.08,.55],[2.76,.05,.40],[4.07,.028,.28],[5.43,.014,.20]];function strike(t,vel){const nb=ctx.createBuffer(1,ctx.sampleRate*.05,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);const n=ctx.createBufferSource();n.buffer=nb;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2300;bp.Q.value=2.5;const ng=ctx.createGain();ng.gain.value=.10*vel;n.connect(bp);bp.connect(ng);ng.connect(master);n.start(t);PARTIALS.forEach(([r,lvl,dec])=>{const o=ctx.createOscillator();o.type='sine';const f=BASE*r*Math.pow(2,(Math.random()*12-6)/1200);o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.997,t+dec);const g=ctx.createGain();g.gain.value=0;o.connect(g);g.connect(master);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(lvl*vel,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dec);o.start(t);o.stop(t+dec+.05)})}strike(t0,1);strike(t0+.09,.45)}catch(e){}}
  function leave(link,klass,delay,ring=false){link.addEventListener('click',e=>{if(reduced)return;e.preventDefault();sessionStorage.setItem('lsd_from','landing');if(ring)chime();document.body.classList.add(klass);setTimeout(()=>location.href=link.href,delay)})}leave(document.getElementById('hotWork'),'cutting',740,true);leave(document.getElementById('hotAbout'),'fading',340);leave(document.getElementById('hotHearsay'),'pinkfade',430);
  const snd=document.getElementById('snd');function soundLabel(){const on=soundOn();snd.textContent='Sound · '+(on?'On':'Off');snd.setAttribute('aria-pressed',on?'true':'false')}snd.addEventListener('click',()=>{localStorage.setItem('lsd_sound',soundOn()?'off':'on');soundLabel()});soundLabel();
  const FROM=sessionStorage.getItem('lsd_from');if(FROM){sessionStorage.removeItem('lsd_from')}if(FROM&&FROM!=='landing'&&!reduced){window._settled=true;const st=document.getElementById('stage');st.style.filter='brightness(.25)';setTimeout(()=>{st.style.transition='filter .55s ease';st.style.filter='brightness(1)'},60);setTimeout(()=>{st.style.transition='';st.style.filter=''},950)}
  (function(){const p=document.getElementById('plate'),im=new Image();im.onload=()=>{if(window._settled)p.style.transition='none';p.style.backgroundImage="url('landing.webp')";const go=()=>p.classList.add('resolved');requestAnimationFrame(()=>requestAnimationFrame(go));setTimeout(go,450)};im.src='landing.webp'})();
  const HOME_TITLE=document.title;document.addEventListener('visibilitychange',()=>{document.title=document.hidden?'( the diner is still open )':HOME_TITLE});
</script>
