<style>
  :root{
    --cream:#ece2c6; --cream-dim:#b9ad8c; --green:#6de07a;
    --bar:#080706; --meta:#968c7a; --meta-hi:#e8dcc4; --bar-h:34px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;height:100%;overflow:hidden}
  body{display:flex; flex-direction:column}

  /* --- FilmFrame bars: viewport-fixed, outside the scene. Never animate, never scale. --- */
  .bar{flex:0 0 var(--bar-h); background:var(--bar); z-index:20;
    display:flex; align-items:center; justify-content:space-between; padding:0 28px;
    font-family:Consolas,"Courier New",monospace; font-size:11px; letter-spacing:.30em;
    text-transform:uppercase; color:var(--meta)}
  .bar .hi{color:var(--meta-hi)}
  .bar span{white-space:nowrap}

  .scenewrap{flex:1 1 auto; position:relative; overflow:hidden; background:#000}
  .stage{
    position:absolute; left:50%; top:50%; width:1536px; height:864px;
    transform:translate(-50%,-50%) scale(var(--fit,1)); transform-origin:center;
    overflow:hidden;
    background:#000;
    font-family:"Bahnschrift","Arial Narrow","Helvetica Neue",Arial,sans-serif;
    user-select:none;
  }

  /* --- sign slots: live faces registered to the measured cabinet footprints --- */
  .slot{
    position:absolute; cursor:pointer; overflow:hidden;
    background:
      radial-gradient(ellipse 90% 75% at 50% 42%, #f2e6b6 0%, #e6d59f 52%, #cdb987 100%);
    border:1px solid rgba(48,38,20,.55);
    box-shadow:
      0 0 46px 14px rgba(238,206,132,.30),
      0 0 110px 30px rgba(220,180,100,.12),
      inset 0 0 30px rgba(255,244,206,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#33281a; padding:6px 10px; line-height:.98;
    transition:filter .18s ease, box-shadow .18s ease;
  }
  .slot .face{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  .slot .title{font-weight:700; text-transform:uppercase; letter-spacing:.01em}
  .slot .net{text-transform:uppercase; letter-spacing:.13em; opacity:.68; margin-top:.42em}
  .slot:hover, .slot:focus-visible{filter:brightness(1.10);
    box-shadow:0 0 54px 17px rgba(242,214,142,.40), 0 0 120px 34px rgba(224,186,106,.16),
    inset 0 0 30px rgba(255,246,212,.42)}
  .slot:focus-visible{outline:2px solid rgba(236,226,198,.85); outline-offset:3px}
  /* hero = light, not scale: the hero cabinet burns, the street stays a street */
  .slot.hero{filter:brightness(1.06)}
  .slot.dimmed{filter:brightness(.84) sepia(.12)}
  .slot.ph .face{opacity:.55}
  /* ballast settle: the sign catches when a project lands on the hero cabinet */
  .slot.settle{animation:ballast .16s steps(2,end)}
  @keyframes ballast{0%{filter:brightness(.72)}55%{filter:brightness(1.14)}100%{filter:brightness(1.06)}}

  /* street reflections: each cabinet owns a pool of light on the wet asphalt;
     the pool follows the hero state. Physical truth, no new motion source. */
  .refl{position:absolute; pointer-events:none; z-index:2; mix-blend-mode:screen;
    background:radial-gradient(ellipse 75% 90% at 50% 0%, rgba(255,224,156,.11), rgba(255,224,156,0) 72%);
    opacity:.38; transition:opacity .45s ease}
  .refl.hot{opacity:.95}

  /* slot geometry = measured lit-face footprints (luminance blobs off the plate) */
  #s0{left:37.0%; top:20.7%; width:20.7%; height:37.7%}   /* center cabinet */
  #s0 .title{font-size:44px} #s0 .net{font-size:14px}
  #s1{left:60.4%; top:28.3%; width:16.1%; height:30.4%}   /* right */
  #s1 .title{font-size:29px} #s1 .net{font-size:12px}
  #s2{left:79.0%; top:32.8%; width:13.9%; height:24.8%}   /* far right */
  #s2 .title{font-size:21px} #s2 .net{font-size:11px}
  #s3{left:24.0%; top:30.2%; width:11.5%; height:26.8%}   /* left */
  #s3 .title{font-size:19px} #s3 .net{font-size:10px}

  /* --- passing headlights: the world continues off-frame. A warm wash sweeps
         left to right, under the glass (the light is outside), rare and unannounced.
         The one ambient motion on this surface, operator-picked. --- */
  #headlights{position:absolute; top:0; bottom:0; left:0; width:30%; pointer-events:none;
    z-index:3; opacity:0; mix-blend-mode:screen; transform:translateX(-130%) skewX(-10deg);
    background:linear-gradient(90deg, transparent,
      rgba(255,214,150,.13) 35%, rgba(255,228,172,.19) 50%,
      rgba(255,214,150,.11) 65%, transparent)}
  #headlights.pass{animation:sweep 3.4s cubic-bezier(.3,.05,.4,1) forwards}
  @keyframes sweep{
    0%{transform:translateX(-130%) skewX(-10deg); opacity:0}
    14%{opacity:.9}
    82%{opacity:.95}
    100%{transform:translateX(480%) skewX(-10deg); opacity:0}}

  /* --- glass: rain + dirt ABOVE the faces (we are inside; they are across the street) --- */
  .glass{position:absolute; inset:0; pointer-events:none; z-index:4; opacity:.20; mix-blend-mode:screen;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='r'><feTurbulence type='turbulence' baseFrequency='0.012 0.28' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.8  0 0 0 0 0.75  0 0 0 0 0.62  0 0 0 0.35 0'/></filter><rect width='100%25' height='100%25' filter='url(%23r)'/></svg>");
    filter:blur(.4px)}
  /* grain: applied ONCE, over everything */
  .grain{position:absolute; inset:0; pointer-events:none; z-index:5; opacity:.09; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .vig{position:absolute; inset:0; pointer-events:none; z-index:5; box-shadow:inset 0 0 240px 46px rgba(0,0,0,.5)}

  /* --- live soft-lock index as gold-leaf window lettering: it belongs to the glass,
         not to an app. Viewport layer, never scales with the scene. --- */
  .nav{position:absolute; left:40px; bottom:30px; z-index:10;
    font-family:Georgia,"Times New Roman",serif;}
  .nav .cap{color:#a8946a; font-size:10.5px; letter-spacing:.34em; text-transform:uppercase; opacity:.85; margin-bottom:10px;
    text-shadow:0 1px 1px rgba(0,0,0,.8), 0 -1px 0 rgba(255,244,214,.14)}
  .nav .row{display:flex; align-items:baseline; gap:12px; padding:3px 0; cursor:pointer;
    color:#c4ad7d; font-size:15px; letter-spacing:.14em; text-transform:uppercase;
    text-shadow:0 1px 1px rgba(0,0,0,.85), 0 -1px 0 rgba(255,246,218,.18);
    transition:color .18s ease, text-shadow .18s ease}
  .nav .row .num{width:22px; opacity:.5; font-variant-numeric:tabular-nums; font-size:12px}
  .nav .row:hover, .nav .row:focus-visible{color:#ecd9a4;
    text-shadow:0 1px 1px rgba(0,0,0,.85), 0 0 14px rgba(232,198,120,.45)}
  .nav .row:focus-visible{outline:2px solid rgba(236,226,198,.85); outline-offset:2px}
  .nav .row.active{color:#f4e3af;
    text-shadow:0 1px 1px rgba(0,0,0,.85), 0 0 18px rgba(238,206,130,.6), 0 0 40px rgba(230,190,110,.25)}
  .nav .row.active .num{opacity:.9}
  .nav .more{color:#a8946a; opacity:.6; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
    padding:6px 0 0 34px; cursor:default;
    text-shadow:0 1px 1px rgba(0,0,0,.8)}

  /* one quiet hint; fades after first interaction */
  .hint{position:absolute; right:34px; bottom:30px; z-index:10; color:#a8946a; opacity:.5;
    font-family:Georgia,serif; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    text-shadow:0 1px 1px rgba(0,0,0,.8);
    transition:opacity 1.2s ease}
  .hint.gone{opacity:0}

  /* the way out: gold lettering, viewport layer */
  .exit{position:absolute; right:34px; top:22px; z-index:10; text-decoration:none;
    color:#c4ad7d; font-family:Georgia,serif; font-size:12.5px; letter-spacing:.16em;
    text-transform:uppercase; text-shadow:0 1px 1px rgba(0,0,0,.85);
    transition:color .18s ease, text-shadow .18s ease}
  .exit:hover, .exit:focus-visible{color:#f4e3af;
    text-shadow:0 1px 1px rgba(0,0,0,.85), 0 0 14px rgba(232,198,120,.45)}
  .exit:focus-visible{outline:2px solid rgba(236,226,198,.85); outline-offset:2px}
  #fade{position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    z-index:15; transition:opacity .3s ease}
  body.leaving #fade{opacity:1}
  body.leaving .bar span{opacity:0}

  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

  .bar span{transition:opacity .3s ease}
  body.arriving .bar span{opacity:0}

  @media (prefers-reduced-motion: reduce){
    .slot, .hint{transition:none}
    .slot.settle{animation:none}
    #headlights.pass{animation:none}
  }

  /* the plate arrives dark and resolves — boot behavior, one beat per load */
  #plate{position:absolute; inset:0; z-index:0; background:#000 center/cover no-repeat url('data:image/webp;base64,UklGRqgAAABXRUJQVlA4IJwAAAAQBACdASoYAA0APulgqE0pJaQiMAgBIB0JZgCw7CFr25tWptM8Psy0AAD+wa3PuiMmdQaPcrAlxhcoX57BS7R1/sdB9z2jxUH5pIJaL5I1UzaReTpWRqkZXHyt6XGQjUf3G/YLvTZlxxWCmrQ7gwv+UzU77p6W++Fxi91+nGBR/Ed9EGJgqOpFfM4xq+PSBMNG8mGDafXxxLoqAAA=');
    filter:blur(12px) brightness(.6); transform:scale(1.04);
    transition:filter .45s ease, transform .45s ease}
  #plate.resolved{filter:none; transform:none}
  @media (prefers-reduced-motion: reduce){ #plate{transition:none} }

  /* sound switch: gold register, remembered across the site */
  .snd{position:absolute; right:34px; bottom:52px; z-index:11; cursor:pointer; background:none; border:0;
    font-family:Georgia,serif; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:#a8946a; text-shadow:0 1px 1px rgba(0,0,0,.8); transition:color .18s ease}
  .snd:hover,.snd:focus-visible{color:#f4e3af}
  .snd:focus-visible{outline:2px solid rgba(236,226,198,.85); outline-offset:2px}
  .slot:active{filter:brightness(1.02)}
</style>

<div class="bar top"><span><span class="hi">Ian Luna</span>&nbsp;&nbsp;·&nbsp;&nbsp;Creative Director</span><span>MMX — MMXXVI&nbsp;&nbsp;·&nbsp;&nbsp;Frame 002</span></div>
<div class="scenewrap" id="wrap">
  <div class="stage" id="stage" tabindex="0" role="group" aria-label="Selected work. Case studies displayed as illuminated street signs seen from a diner booth.">
    <div id="plate"></div>
    <div class="slot" id="s0" role="button" tabindex="0"></div>
    <div class="slot" id="s1" role="button" tabindex="0"></div>
    <div class="slot" id="s2" role="button" tabindex="0"></div>
    <div class="slot" id="s3" role="button" tabindex="0"></div>

    <div id="headlights"></div>
    <div class="glass"></div>
    <div class="grain"></div>
    <div class="vig"></div>
  </div>

  <nav class="nav" id="nav" aria-label="Selected work index">
    <div class="cap">Selected Work</div>
  </nav>
  <div class="hint" id="hint">Click a sign</div>
  <button class="snd" id="snd" aria-pressed="true">Sound · On</button>
  <a class="exit" id="exit" href="index.html" aria-label="Leave the diner — back to the front of the building">← The Diner</a>
  <div class="sr" aria-live="polite" id="live"></div>
  <div id="fade"></div>
</div>
<div class="bar bottom"><span>INT. The Last Stop Diner — Booth — Night</span><span id="clock">T 00:00 UTC</span></div>

<script>
  const projects = [
    {t:"Beast Games", net:"Amazon Prime Video", ph:false},
    {t:"Go", net:"ESPN", ph:false},
    {t:"Hometown", net:"HBO", ph:false},
    {t:"The Quiet Issue", net:"New York Times", ph:false},
    {t:"Project 05", net:"", ph:true},
    {t:"Project 06", net:"", ph:true},
    {t:"Project 07", net:"", ph:true},
    {t:"Project 08", net:"", ph:true},
    {t:"Project 09", net:"", ph:true},
    {t:"Project 10", net:"", ph:true},
  ];
  // Whetstone P1 fix (2026-07-04): placeholders never reach the cabinets.
  // Cycling is capped to real projects until the honest 8-10 land.
  const REAL = projects.filter(p => !p.ph);
  const N = REAL.length;
  const slots = ['s0','s1','s2','s3'].map(id=>document.getElementById(id));
  // street reflection pools, one per cabinet, geometry derived from the slots
  const GEO = [[37.0,58.4,20.7],[60.4,58.7,16.1],[79.0,57.6,13.9],[24.0,57.0,11.5]];
  const refls = GEO.map(([l,t,w])=>{
    const r = document.createElement('div');
    r.className = 'refl';
    r.style.left = l+'%'; r.style.top = t+'%'; r.style.width = w+'%'; r.style.height = '14%';
    document.getElementById('stage').insertBefore(r, document.getElementById('headlights'));
    return r;
  });
  const nav = document.getElementById('nav');
  const stage = document.getElementById('stage');
  const live = document.getElementById('live');
  const hint = document.getElementById('hint');
  let hero = 0, interacted = false;

  // scene fills the frame like a shot (cover: no pillarboxing, slight vertical crop allowed);
  // bars and index live at the viewport layer and never scale
  function fit(){
    const w = document.getElementById('wrap');
    const s = Math.max(w.clientWidth / 1536, w.clientHeight / 864);
    stage.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);

  // index: real projects only, placeholders collapsed
  const rows = REAL.map((p,i)=>{
    const r = document.createElement('div');
    r.className = 'row'; r.tabIndex = 0; r.setAttribute('role','button');
    r.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><span class="name">${p.t}</span>`;
    r.setAttribute('aria-label', `Feature ${p.t}`);
    r.addEventListener('click',()=>{touch(); setHero(i);});
    r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); touch(); setHero(i);}});
    nav.appendChild(r);
    return r;
  });
  const more = document.createElement('div');
  more.className = 'more'; more.textContent = '+ six more on the way';
  nav.appendChild(more);

  function faceHTML(p){
    let h = `<span class="title">${p.t.replace(' ','<br>')}</span>`;
    if(p.net) h += `<span class="net">${p.net}</span>`;
    return `<div class="face">${h}</div>`;
  }

  function render(withSettle){
    for(let k=0;k<4;k++){
      const p = REAL[(hero + k) % N];
      slots[k].innerHTML = faceHTML(p);
      slots[k].classList.toggle('ph', p.ph);
      slots[k].classList.toggle('hero', k===0);
      slots[k].classList.toggle('dimmed', k!==0);
      slots[k].setAttribute('aria-label', p.ph ? `${p.t}, coming soon` : `Feature ${p.t}, ${p.net}`);
    }
    if(withSettle){
      slots[0].classList.remove('settle'); void slots[0].offsetWidth;
      slots[0].classList.add('settle');
    }
    refls.forEach((r,k)=>r.classList.toggle('hot', k===0));
    rows.forEach((r,i)=>r.classList.toggle('active', i===hero));
    live.textContent = `Featured: ${REAL[hero].t}${REAL[hero].net ? ', ' + REAL[hero].net : ''}`;
  }
  function setHero(i){ hero = ((i % N)+N)%N; render(true); }
  function touch(){ if(!interacted){ interacted = true; hint.classList.add('gone'); } }

  slots.forEach((s,k)=>{
    s.addEventListener('click',()=>{touch(); setHero((hero+k)%N);});
    s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); touch(); setHero((hero+k)%N);}});
  });
  stage.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){touch(); setHero(hero+1);}
    else if(e.key==='ArrowLeft'){touch(); setHero(hero-1);}
    else if(e.key==='Enter' && e.target===stage){touch(); stage.dataset.open = REAL[hero].t;}
  });

  function clock(){
    const n = new Date();
    document.getElementById('clock').textContent =
      `T ${String(n.getUTCHours()).padStart(2,'0')}:${String(n.getUTCMinutes()).padStart(2,'0')} UTC`;
  }
  clock(); setInterval(clock, 60000);

  // rare passing car: first one inside the first minute, then every 60-120s.
  // Never fires under reduced motion; never fires while the tab is hidden.
  const hl = document.getElementById('headlights');
  const noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function scheduleCar(first){
    const delay = first ? 25000 + Math.random()*20000 : 60000 + Math.random()*60000;
    setTimeout(()=>{
      if(!noMotion && !document.hidden){
        hl.classList.remove('pass'); void hl.offsetWidth; hl.classList.add('pass');
      }
      scheduleCar(false);
    }, delay);
  }
  scheduleCar(true);

  // leaving: the door closes gently from inside — one quiet strike, no double hit
  function exitBell(){
    if(localStorage.getItem('lsd_sound')==='off') return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ctx.currentTime;
      const master = ctx.createGain(); master.gain.value = .34;
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 3000;
      master.connect(lp); lp.connect(ctx.destination);
      const BASE = 840;
      [[1,.10,.65],[1.83,.06,.48],[2.76,.035,.34],[4.07,.018,.22]].forEach(([r,lvl,dec])=>{
        const o = ctx.createOscillator(); o.type='sine';
        const f = BASE * r * Math.pow(2, (Math.random()*10-5)/1200);
        o.frequency.setValueAtTime(f, t0);
        o.frequency.linearRampToValueAtTime(f*.997, t0+dec);
        const g = ctx.createGain(); g.gain.value = 0;
        o.connect(g); g.connect(master);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(lvl*.6, t0+.007);
        g.gain.exponentialRampToValueAtTime(.0001, t0+dec);
        o.start(t0); o.stop(t0+dec+.05);
      });
      const nb = ctx.createBuffer(1, ctx.sampleRate*.04, ctx.sampleRate);
      const nd = nb.getChannelData(0);
      for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1)*(1-i/nd.length);
      const n = ctx.createBufferSource(); n.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2100; bp.Q.value=2.5;
      const ng = ctx.createGain(); ng.gain.value = .05;
      n.connect(bp); bp.connect(ng); ng.connect(master);
      n.start(t0);
    }catch(e){}
  }
  document.getElementById('exit').addEventListener('click', e=>{
    e.preventDefault();
    exitBell();
    sessionStorage.setItem('lsd_from','work');
    if(noMotion){ location.href = 'index.html'; return; }
    document.body.classList.add('leaving');
    setTimeout(()=>{ location.href = 'index.html'; }, 420);
  });

  // the slate follows the visitor out of the room
  const HOME_TITLE = document.title;
  document.addEventListener('visibilitychange', ()=>{
    document.title = document.hidden ? '( the diner is still open )' : HOME_TITLE;
  });


  // sound switch (site-wide preference)
  const sndEl = document.getElementById('snd');
  function sndLabel(){ const on = localStorage.getItem('lsd_sound')!=='off';
    sndEl.textContent = 'Sound · ' + (on ? 'On' : 'Off');
    sndEl.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  sndEl.addEventListener('click', ()=>{
    localStorage.setItem('lsd_sound', localStorage.getItem('lsd_sound')==='off' ? 'on' : 'off');
    sndLabel(); });
  sndLabel();

  // arrival-threshold owns the load beat; the plate then resolves instantly
  if(location.hash === '#threshold') window._settled = true;

  // full plate resolves over the LQIP; instant when an arrival settle owns the beat
  (function(){ const p=document.getElementById('plate'); const im=new Image();
    im.onload=()=>{ if(window._settled) p.style.transition='none';
      p.style.backgroundImage="url('work.webp')";
      const go=()=>p.classList.add('resolved');
      requestAnimationFrame(()=>requestAnimationFrame(go));
      setTimeout(go, 450); };  // hidden-tab fallback: the world resolves anyway
    im.src='work.webp'; })();

  fit();
  stage.focus();
  render(false);

  // threshold arrival: exposure settles as you sit down. Bars static, text fades back in.
  if(location.hash === '#threshold' && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.body.classList.add('arriving');
    stage.style.filter = 'brightness(.22)';
    setTimeout(()=>{
      stage.style.transition = 'filter .55s ease';
      stage.style.filter = 'brightness(1)';
      document.body.classList.remove('arriving');
    }, 60);
    // hard fallback: whatever happens, the room reaches full exposure
    setTimeout(()=>{ stage.style.transition = ''; stage.style.filter = ''; document.body.classList.remove('arriving'); }, 950);
    history.replaceState(null, '', location.pathname);
  }
</script>


<script>
/* keyboard-drill-down injected – do not remove this comment */
(function() {
  const containers = document.querySelectorAll(
    '#blocked-list, #ledger-list, #rig-list, [data-screen="blocked"] .list, [data-screen="ledger"] .list, [data-screen="rig"] .list'
  );
  containers.forEach(function(container) {
    if (container.dataset.kbdDrilldown) return;
    container.dataset.kbdDrilldown = 'true';
    container.setAttribute('tabindex', '0');
    container.addEventListener('keydown', function(e) {
      const items = container.querySelectorAll('.list-item');
      if (!items.length) return;
      let idx = parseInt(container.getAttribute('data-selected-index') || '0', 10);
      if (isNaN(idx)) idx = 0;

      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault();
        idx = Math.min(idx + 1, items.length - 1);
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault();
        idx = Math.max(idx - 1, 0);
